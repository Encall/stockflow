services:
  app:
    image: ghcr.io/encall/stockflow/app:latest
    container_name: stockflow-app
    ports:
      - "8501:8501"
    environment:
      # Streamlit configuration
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      
      - "traefik.http.routers.stockflow.rule=Host(`stockflow.encall.space`)"
      - "traefik.http.routers.stockflow.entrypoints=websecure"
      - "traefik.http.routers.stockflow.tls=true"
      - "traefik.http.routers.stockflow.tls.certresolver=leresolver"
      - "traefik.http.routers.stockflow.service=stockflow"
      - "traefik.http.services.stockflow.loadbalancer.server.port=8501"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; resp = urllib.request.urlopen('http://localhost:8501/_stcore/health'); sys.exit(0 if getattr(resp, 'status', 200)==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - traefik
      
networks:
  traefik:
    external: true