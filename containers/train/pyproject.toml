[project]
name = "train"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "minio>=7.2.18",
    "mlflow==3.4.0",
    "boto3==1.34.20",
    "pandas==2.1.3",
    "numpy>=1.24.3,<1.27.0",
    "scikit-learn==1.3.2",
    "torch>=2.9.1,<3.0",
    "python-dotenv>=1.0.0",
    "setuptools",
    "opentelemetry-api",
    "opentelemetry-sdk",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]
torchvision = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true