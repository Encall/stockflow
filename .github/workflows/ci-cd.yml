name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'containers/**'
      - 'airflow/dags/**'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      run-full-pipeline:
        description: 'Run full pipeline skipping change detection'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read
  packages: write

jobs:
  detect-changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      dags-changed: ${{ steps.filter.outputs.dags }}
      containers-changed: ${{ steps.filter.outputs.containers }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          base: 'refs/heads/main'
          initial-fetch-depth: '200'
          filters: |
            dags:
              - 'airflow/dags/**'
            containers:
              - 'containers/**'

  validate-dags:
    needs: detect-changes
    if: inputs.run-full-pipeline == 'true' || needs.detect-changes.outputs.dags-changed == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/validate-dags.yml
    with:
      dags-changed: ${{ inputs.run-full-pipeline == 'true' && 'true' || needs.detect-changes.outputs.dags-changed }}

  docker-build:
    needs: detect-changes
    if: inputs.run-full-pipeline == 'true' || needs.detect-changes.outputs.containers-changed == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/docker-build.yml
    with:
      run-full-pipeline: ${{ inputs.run-full-pipeline }}
    secrets: inherit

  sync-dags:
    needs: [docker-build, validate-dags, detect-changes]
    if: inputs.run-full-pipeline == 'true' || needs.detect-changes.outputs.dags-changed == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/sync-dags.yml
    with:
      dags-changed: ${{ inputs.run-full-pipeline == 'true' && 'true' || needs.detect-changes.outputs.dags-changed }}
    secrets: inherit

  deploy-app:
    needs: docker-build
    if: needs.docker-build.outputs.app-built == 'true'
    uses: ./.github/workflows/deploy-app.yml
    secrets: inherit

  deploy-serve:
    needs: docker-build
    if: needs.docker-build.outputs.serve-built == 'true'
    uses: ./.github/workflows/deploy-serve.yml
    secrets: inherit
