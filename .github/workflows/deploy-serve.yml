name: Deploy Serve to Portainer

on:
  workflow_call:
  workflow_dispatch:

jobs:
  deploy:
    name: Trigger Portainer Webhook for Serve
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Trigger Portainer Webhook
        env:
          WEBHOOK_URL: ${{ secrets.PORTAINER_SERVE_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "⚠️  PORTAINER_SERVE_WEBHOOK_URL secret not set. Skipping deployment."
            echo "To enable automatic deployment:"
            echo "1. Set up your serve service in Portainer"
            echo "2. Enable the service webhook in Portainer"
            echo "3. Add PORTAINER_SERVE_WEBHOOK_URL as a repository secret"
            exit 0
          fi
          
          echo "🚀 Triggering Portainer deployment for serve container..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$WEBHOOK_URL")
          
          if [ "$HTTP_CODE" -eq 200 ] || [ "$HTTP_CODE" -eq 204 ]; then
            echo "✅ Webhook triggered successfully (HTTP $HTTP_CODE)"
          else
            echo "❌ Webhook failed with HTTP $HTTP_CODE"
            exit 1
          fi
      
      - name: Wait for deployment
        env:
          WEBHOOK_URL: ${{ secrets.PORTAINER_SERVE_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            exit 0
          fi
          echo "⏳ Waiting 30 seconds for deployment to complete..."
          sleep 30
      
      - name: Health check
        env:
          SERVE_URL: ${{ secrets.SERVE_URL }}
          WEBHOOK_URL: ${{ secrets.PORTAINER_SERVE_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK_URL" ] || [ -z "$SERVE_URL" ]; then
            echo "⚠️  Skipping health check (SERVE_URL or PORTAINER_SERVE_WEBHOOK_URL not configured)"
            exit 0
          fi
          
          echo "🏥 Checking serve health at $SERVE_URL..."
          
          # Try up to 5 times with 10 second intervals (model loading can take time)
          for i in {1..5}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$SERVE_URL/health" || echo "000")
            
            if [ "$HTTP_CODE" -eq 200 ]; then
              echo "✅ Serve container is healthy (HTTP $HTTP_CODE)"
              
              # Fetch and display health check response
              HEALTH_RESPONSE=$(curl -s "$SERVE_URL/health" || echo "{}")
              echo "Health check response:"
              echo "$HEALTH_RESPONSE" | jq '.' 2>/dev/null || echo "$HEALTH_RESPONSE"
              exit 0
            else
              echo "⚠️  Attempt $i/5: Serve returned HTTP $HTTP_CODE"
              if [ $i -lt 5 ]; then
                sleep 10
              fi
            fi
          done
          
          echo "❌ Health check failed after 5 attempts"
          exit 1
