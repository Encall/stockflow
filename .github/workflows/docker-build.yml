name: Build and Push Docker Images

on:
  # push:
  #   branches: [main]
  #   paths: ['containers/**', '.github/workflows/docker-build.yml']
  # pull_request:
  #   branches: [main]
  #   paths: ['containers/**']
  workflow_dispatch:
    inputs:
      container:
        description: 'Container to build (etl, train, or all)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - etl
          - train

env:
  REGISTRY: ghcr.io

# Add concurrency to cancel old runs on new commits
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Changed Containers
    runs-on: ubuntu-latest
    outputs:
      etl: ${{ steps.filter.outputs.etl }}
      train: ${{ steps.filter.outputs.train }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          # Compare changes against main for all events (avoids missing 'before' payload)
          base: 'refs/heads/main'
          # make sure enough history is fetched when searching for merge-base
          initial-fetch-depth: '200'
          filters: |
            etl:
              - 'containers/etl/**'
            train:
              - 'containers/train/**'
              
  build-and-push:
      name: Build and Push ${{ matrix.container }}
      needs: detect-changes
      
      if: |
        needs.detect-changes.outputs.etl == 'true' ||
        needs.detect-changes.outputs.train == 'true' ||
        github.event_name == 'workflow_dispatch'
        
      runs-on: ubuntu-latest
      permissions:
        contents: read
        packages: write
      
      strategy:
        fail-fast: false
        matrix:
          container: [etl, train]

      steps:
        - name: Check if should build
          id: check
          run: |
            SHOULD_BUILD=false
            
            # For push events, always build if changes detected
            if [[ "${{ github.event_name }}" == "push" ]]; then
              if [[ "${{ matrix.container }}" == "etl" && "${{ needs.detect-changes.outputs.etl }}" == "true" ]] || \
                 [[ "${{ matrix.container }}" == "train" && "${{ needs.detect-changes.outputs.train }}" == "true" ]]; then
                SHOULD_BUILD=true
              fi
            # For manual dispatch, check the selected container
            elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
              if [[ "${{ inputs.container }}" == "all" ]] || \
                 [[ "${{ inputs.container }}" == "${{ matrix.container }}" ]]; then
                SHOULD_BUILD=true
              fi
            fi
            
            echo "should_build=$SHOULD_BUILD" >> "$GITHUB_OUTPUT"
          shell: bash
        
        - name: Checkout code
          if: steps.check.outputs.should_build == 'true'
          uses: actions/checkout@v4

        - name: Set up QEMU
          if: steps.check.outputs.should_build == 'true'
          uses: docker/setup-qemu-action@v3
        
        - name: Set up Docker Buildx
          if: steps.check.outputs.should_build == 'true'
          uses: docker/setup-buildx-action@v3
        
        - name: Log in to GitHub Container Registry
          if: steps.check.outputs.should_build == 'true'
          uses: docker/login-action@v3
          with:
            registry: ${{ env.REGISTRY }}
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}
        
        - name: Extract metadata
          id: meta
          if: steps.check.outputs.should_build == 'true'
          uses: docker/metadata-action@v5
          with:
            images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.container }}
            tags: |
              type=raw,value=latest,enable={{is_default_branch}}
              type=semver,pattern={{version}}
              type=ref,event=branch
              type=ref,event=pr
              type=sha,prefix=

        - name: Get SHA tag
          id: get_sha
          if: steps.check.outputs.should_build == 'true'
          run: |
            TAGS="${{ steps.meta.outputs.tags }}"
            # TAGS are full image refs like ghcr.io/owner/repo/image:tag
            # extract the tag part after the last ':' and search for a hex SHA
            SHA=""
            echo "$TAGS" | tr ',' '\n' | while read -r full; do
              tag_only=$(echo "$full" | awk -F':' '{print $NF}')
              if echo "$tag_only" | grep -Eiq '^[0-9a-f]{7,40}$'; then
                SHA="$tag_only"
                break
              fi
            done

            if [ -z "$SHA" ]; then
              # fallback: look for any tag that includes the string 'sha' and extract hex
              SHA=$(echo "$TAGS" | tr ',' '\n' | awk -F':' '{print $NF}' | grep -i 'sha' | sed -E 's/.*([0-9a-f]{7,40}).*/\1/I' | head -n1 || true)
            fi

            if [ -z "$SHA" ]; then
              # final fallback: use workflow commit SHA
              echo "warning: couldn't find SHA-like tag in metadata; falling back to GITHUB_SHA"
              SHA=${GITHUB_SHA}
              # shorten to 40 or 7 chars depending on usage below
              SHA=$(echo "$SHA" | sed -E 's/^([0-9a-f]{7,40}).*/\1/')
            fi

            if [ -z "$SHA" ]; then
              echo "error: couldn't determine a SHA tag from metadata (TAGS: $TAGS) and GITHUB_SHA is empty" >&2
              exit 1
            fi

            echo "sha=$SHA" >> "$GITHUB_OUTPUT"
        
        - name: Build and push SHA-tagged image
          id: build
          if: steps.check.outputs.should_build == 'true'
          uses: docker/build-push-action@v5
          with:
            context: containers/${{ matrix.container }}
            platforms: linux/amd64,linux/arm64
            push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
            tags: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.container }}:${{ steps.get_sha.outputs.sha }}
            labels: ${{ steps.meta.outputs.labels }}
            cache-from: type=gha
            cache-to: type=gha,mode=max

        - name: Verify pushed SHA manifest and cleanup on failure
          if: steps.check.outputs.should_build == 'true' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
          run: |
            set -euo pipefail
            apt-get update -y && apt-get install -y jq curl
            REPO="${{ github.repository }}/${{ matrix.container }}"
            SHA_TAG="${{ steps.get_sha.outputs.sha }}"

            echo "Inspecting manifest for ghcr.io/$REPO:$SHA_TAG"
            manifest=$(curl -s -H "Accept: application/vnd.oci.image.index.v1+json" -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "https://ghcr.io/v2/$REPO/manifests/$SHA_TAG")
            echo "$manifest" | jq .

            if echo "$manifest" | jq -e '.manifests[] | select(.platform==null)' >/dev/null; then
              echo "Manifest contains entries missing platform metadata; cleaning up"
              DIGEST=$(curl -sI -H "Accept: application/vnd.oci.image.index.v1+json" -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "https://ghcr.io/v2/$REPO/manifests/$SHA_TAG" | awk '/Docker-Content-Digest/ {print $2}' | tr -d '\r')
              if [ -n "$DIGEST" ]; then
                echo "Deleting digest: $DIGEST"
                curl -s -X DELETE -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "https://ghcr.io/v2/$REPO/manifests/$DIGEST"
              fi
              echo "Deleted incomplete manifest; failing job to avoid partial artifacts"
              exit 1
            fi

        - name: Promote tags from verified SHA (create manifest tags)
          if: steps.check.outputs.should_build == 'true' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
          run: |
            set -euo pipefail
            REPO="${{ github.repository }}/${{ matrix.container }}"
            ALL_TAGS="${{ steps.meta.outputs.tags }}"
            SHA_TAG="${{ steps.get_sha.outputs.sha }}"

            echo "Promoting verified SHA ($SHA_TAG) to tags:"
            echo "$ALL_TAGS" | tr ',' '\n' | while read -r tag; do
              [ -z "$tag" ] && continue
              if [ "$tag" = "$SHA_TAG" ]; then continue; fi
              echo " - $tag"
              docker buildx imagetools create -t ghcr.io/${REPO}:$tag ghcr.io/${REPO}:$SHA_TAG || { echo "promotion failed for $tag"; exit 1; }
            done